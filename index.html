        document.getElementById('search-btn').addEventListener('click', function() {
            const checkboxes = document.querySelectorAll('.filter-checkbox:checked');
            const selectedCategories = Array.from(checkboxes).map(cb => cb.value.toLowerCase());

            const resultsContainer = document.getElementById('results-container');
            resultsContainer.innerHTML = ''; 

            if (selectedCategories.length === 0) {
                resultsContainer.innerHTML = '<div class="no-msg">Click search to see items!</div>';
                return;
            }

            // Strict Matching Rule:
            // An item will ONLY show if every single checked category is present in the item's categories,
            // AND the item doesn't have extra categories that weren't checked (or you can adjust if items should be subsets).
            // Here, using `.every()` ensures that if you check Vegetable + Sweet, Broccoli is excluded because it lacks "sweet".
            const filteredItems = items.filter(item => {
                // Check if all selected categories exist in the item's categories
                const allSelectedArePresent = selectedCategories.every(selectedCat => 
                    item.categories.includes(selectedCat)
                );

                // Optional strict check: Ensure the item doesn't have unselected categories 
                // if you want an exact match, or just use `allSelectedArePresent`. 
                // Based on your example: if only "Vegetable" is checked, Carrot has "sweet" which isn't checked, 
                // so Carrot shouldn't match. Therefore, the item's categories must match the selected categories exactly or be a subset.
                const itemMatchesExactly = item.categories.every(itemCat => 
                    selectedCategories.includes(itemCat)
                );

                return allSelectedArePresent && itemMatchesExactly;
            });

            if (filteredItems.length === 0) {
                resultsContainer.innerHTML = '<div class="default-msg">No items match your selection. Recommended check-up with a doctor.</div>';
                return;
            }

            // Build the table dynamically

                            <th>Recommended treatment</th>

                        </tr>
                    </thead>

            `;

                        <td>${item.color}</td>

                        <td>${item.doctime}</td>
                    </tr>
                `;
            });

            tableHTML += `
                    </tbody>
                </table>
            `;

            resultsContainer.innerHTML = tableHTML;
